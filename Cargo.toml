[package]
name = "inputmodules"
version = "0.1.0"
edition = "2021"
rust-version = "1.61"

[features]
qemu = []
bmp = ["dep:tinybmp"]

[dependencies]
cfg-if = "1.0.0"
embedded-graphics = "0.7.1"
getargs = { version = "0.5.0", default-features = false }
log = "0.4"
tinybmp = { version = "0.4.0", optional = true }
uefi = { version = "0.20", features = ["alloc"] }
uefi-services = "0.17"
# Temporarily override because we need modifications to compare GOP ModeInfo
[patch.crates-io]
uefi = { path = "/home/zoid/clone/uefi-rs/uefi" }
uefi-services = { path = "/home/zoid/clone/uefi-rs/uefi-services" }
#zune-core = { path = "/home/zoid/clone/active/zune-image/zune-core" }
zune-jpeg = { path = "/home/zoid/clone/active/zune-image/zune-jpeg" }

#[dependencies.zune-core]
#version = "0.2"
#default-features = false
#features = [] #[ "x86" ]

[dependencies.zune-jpeg]
version = "0.3"
default-features = false
# TODO: Compilation fails: https://github.com/rust-lang/rust/issues/61721
#features = [ "x86" ]

[dependencies.framework_lib]
path = "/home/zoid/clone/framework-system/framework_lib"
features = ["uefi"]
default-features = false

[profile.release]
lto = true
