[package]
name = "inputmodules"
version = "0.4.8"
edition = "2021"
rust-version = "1.89"
build = "build.rs"

[features]
qemu = []
azalea = []
12in = []
default = ["12in"]

[build-dependencies]
built = { version = "0.8", default-features = false, features = ["chrono", "git2"] }

[dependencies]
cfg-if = "1.0.0"
embedded-graphics = "0.7.1"
getargs = { version = "0.5.0", default-features = false }
log = "0.4"
uefi = { version = "0.41", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
zune-core = "0.2.14"
micromath = "2.1.0"

[dependencies.zune-png]
version = "0.2.1"
default-features = false

[dependencies.framework_lib]
# path = "/home/zoid/clone/framework-system/framework_lib"
git = "https://github.com/FrameworkComputer/framework-system"
rev = "844d64061120676388cbd741f6ba78469cfcef3a"
features = ["uefi"]
default-features = false

[profile.release]
lto = true
