[package]
name = "inputmodules"
version = "0.3.17"
edition = "2021"
rust-version = "1.89"
build = "build.rs"
readme = "../README.md"
license = "BSD-3-Clause"
license-file = "LICENSE.md"

[features]
qemu = []
azalea = []

[build-dependencies]
built = { version = "0.8", default-features = false, features = ["chrono", "git2"] }

[dependencies]
cfg-if = "1.0.0"
embedded-graphics = "0.8.1"
getargs = { version = "0.5.0", default-features = false }
log = "0.4.27"
uefi = { version = "0.41", features = ["alloc"] }
zune-core = "0.4.12"
redox_hwio = { git = "https://github.com/FrameworkComputer/rust-hwio", branch = "freebsd", default-features = false }
dmidecode = { version = "1", default-features = false }

[dependencies.zune-png]
version = "0.4.10"
default-features = false

[dependencies.framework_lib]
#path = "/home/zoid/clone/framework-system/framework_lib"
version = "0.6.7"
default-features = false

[target.'cfg(target_os = "uefi")'.dependencies]
uefi = { version = "0.41", features = ["alloc", "global_allocator", "logger", "panic_handler"] }

# Dependencies to run as a native application on Linux/Windows/macOS
[target.'cfg(not(target_os = "uefi"))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
minifb = { version = "0.29", default-features = false, features = ["x11"] }
nusb = "0.2"

# To get the screen size for fullscreen
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11-dl = "2.21"

[target.'cfg(target_os = "uefi")'.dependencies.framework_lib]
version = "0.6.7"
default-features = false
features = ["uefi"]

[profile.release]
# Make sure LTO is enabled to minimize binary size.
lto = true
# Strip binary for reproducibility and binary size (remove debugging data)
# Otherwise the RSDS signature and some instructions are different in each build
strip = true
opt-level = "s"      # Optimize for size (z and s are similar)
codegen-units = 1    # Better optimization
panic = "abort"      # Remove unwinding code
