name: CI
on:
  push:

jobs:
  build:
    name: Build UEFI executable
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Setup Rust toolchain
      run: rustup show

    - name: Build UEFI app (release)
      run: make release

    - name: Generate artifact version
      run: |
        echo "VERSIONINFO=$(date -u +'%Y-%m-%d-%H-%M-%S')_$GITHUB_SHA" >> $GITHUB_ENV

    # Upload release first to get fast builds from CI
    - name: Upload UEFI app (release)
      uses: actions/upload-artifact@v6
      with:
        name: inputmodules_release_${{ env.VERSIONINFO }}
        path: target/x86_64-unknown-uefi/release/inputmodules.efi

    - name: Build UEFI app (QEMU)
      run: make qemu

    - name: Install authenticode-tool
      run: |
        cargo install --locked authenticode-tool

    # Print in github actions log that you don't have to manually hash it
    - name: Hash release binary
      run: |
        echo "Filesize in KiB"
        du -k --apparent-size target/x86_64-unknown-uefi/release/inputmodules.efi
        echo "Unsigned SHA256"
        sha256sum target/x86_64-unknown-uefi/release/inputmodules.efi
        echo "SHA256 Authenticode"
        authenticode-tool info target/x86_64-unknown-uefi/release/inputmodules.efi

  lints:
    name: Lints
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6

    - name: Setup Rust toolchain
      run: rustup show

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: make clippy

  visual-tests:
    name: Visual Regression Tests
    runs-on: ubuntu-24.04
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust toolchain
      run: rustup show

    - name: Install QEMU and OVMF
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf python3-virt-firmware
        make ovmf/OVMF_CODE.fd
        make ovmf/OVMF_VARS.fd

    - name: Build UEFI app (QEMU release)
      run: make qemu-release

    - name: Build visual test runner
      run: make test-build

    - name: Enable KVM group perms
      run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

    - name: Run visual regression tests
      # To log qemu output instead of make test
      run: ./tests/visual/target/debug/visual-test-runner run --qemu-log tests/visual/qemu-stderr.log

    - name: Print QEMU log on failure
      if: failure()
      run: |
        echo "=== QEMU stderr log ==="
        cat tests/visual/qemu-stderr.log || echo "No QEMU log file found"

    - name: Upload test outputs on failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: visual-test-outputs
        path: tests/visual/outputs/
