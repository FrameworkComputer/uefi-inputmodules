name: "Touchpad but no input modules"
description: "Verify UI when touchpad is installed but no keyboard modules"

steps:
  - action: wait
    ms: 2000

  # Toggle latch closed (key L)
  - action: send_keys
    keys: ["l"]

  # Connect both fans (so we can see inputdeck issues)
  - action: send_keys
    keys: ["v"]

  # First set expansion bay to dual (so we can see inputdeck issues)
  - action: send_keys
    keys: ["e"]

  # Touchpad only, no input modules (key 1)
  - action: send_keys
    keys: ["1"]
  - action: wait
    ms: 500
  - action: screenshot
    name: "touchpad_only"
    compare: true
