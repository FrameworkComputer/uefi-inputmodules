name: "Outdated firmware warning"
description: "Verify the outdated keyboard/PD firmware warning shown on an otherwise OK system"

steps:
  - action: wait
    ms: 2000

  # Everything OK: latch closed, both fans, UMA expansion bay, hubboard,
  # populated input deck, EC diagnostics complete
  - action: send_keys
    keys: ["l", "v", "e", "h", "6", "b"]

  # Toggle the mocked outdated firmware warning on (key P)
  - action: send_keys
    keys: ["p"]
  - action: screenshot
    name: "outdated_firmware"
    compare: true
