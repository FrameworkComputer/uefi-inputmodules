name: "Fan detection states"
description: "Test fan presence detection"

steps:
  - action: wait
    ms: 2000

  # Toggle latch closed (key L)
  - action: send_keys
    keys: ["l"]

  # First set expansion bay to dual (so we can see fan issues) ...
  - action: send_keys
    keys: ["e"]

  # ... also finish interposer ...
  - action: send_keys
    keys: ["e"]

  # ... and hubboard ...
  - action: send_keys
    keys: ["h"]

  # ... and all inputmodules so that the error message is clear
  - action: send_keys
    keys: ["6"]

  # Both fans missing (key Z)
  - action: send_keys
    keys: ["z"]
  - action: screenshot
    name: "both_fans_missing"
    compare: true

  # Right fan missing only (key X)
  - action: send_keys
    keys: ["x"]
  - action: screenshot
    name: "right_fan_missing"
    compare: true

  # Left fan missing only (key C)
  - action: send_keys
    keys: ["c"]
  - action: screenshot
    name: "left_fan_missing"
    compare: true

  # Both fans OK (key V)
  - action: send_keys
    keys: ["v"]
  - action: screenshot
    name: "both_fans_ok"
    compare: true
