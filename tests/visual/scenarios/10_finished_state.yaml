name: "Finished state - All OK"
description: "Test the complete finished state where all requirements are met"

steps:
  - action: wait
    ms: 2000

  # Set up all components to be OK:
  # L = Close latch
  # V = Both fans OK
  # E = Dual interposer expansion bay
  # H = Hubboard present (if toggled off)
  # 6 = Populated top-row + touchpad
  # B = EC device diagnostics complete


  - action: send_keys
    keys: ["l"]

  - action: send_keys
    keys: ["v"]

  - action: send_keys
    keys: ["e"]

  - action: send_keys
    keys: ["h"]

  - action: send_keys
    keys: ["6"]

  - action: send_keys
    keys: ["b"]

  # Capture the finished state
  - action: screenshot
    name: "finished_all_ok"
    compare: true
