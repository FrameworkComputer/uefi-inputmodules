name: "Finished state - All OK"
description: "Test the complete finished state where all requirements are met"

steps:
  - action: wait
    ms: 2000

  # Set up all components to be OK:
  # L = Close latch
  # V = Both fans OK
  # E = Dual interposer expansion bay
  # H = Hubboard present (if toggled off)
  # 6 = Populated top-row + touchpad


  - action: send_keys
    keys: ["l"]
  - action: wait
    ms: 300

  - action: send_keys
    keys: ["v"]
  - action: wait
    ms: 300

  - action: send_keys
    keys: ["e"]
  - action: wait
    ms: 300

  - action: send_keys
    keys: ["h"]
  - action: wait
    ms: 300

  - action: send_keys
    keys: ["6"]
  - action: wait
    ms: 300

  # Capture the finished state
  - action: wait
    ms: 500
  - action: screenshot
    name: "finished_all_ok"
    compare: true
